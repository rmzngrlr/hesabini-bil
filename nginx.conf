server {
    listen 3002;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- PWA onbellek kontrolu ---
    # Service worker Cloudflare/tarayici tarafindan ASLA onbellege alinmamali.
    # Aksi halde yeni sw.js gec goruluyor, "Guncelle" karti cikmiyor
    # (Cloudflare varsayilani: .js uzantisi ~4 saat edge cache).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    # SW icine importScripts ile alinan push eklentisi de bayat kalmasin.
    location = /push-handler.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Hash'li statik varliklar (isimleri icerik hash'i tasir) -> uzun, guvenli cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Canli senkron (SSE) akisi: tek-tek proxy'lenir, BUFFERING KAPALI.
    # Aksi halde nginx event'leri tamponlar ve istemci guncellemeleri gec alir.
    # Jenerik /api/ blogundan ONCE ve "=" tam eslesme oldugu icin oncelik bunda.
    location = /api/budget/stream {
        proxy_pass http://backend:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # Proxy /api requests to the backend container
    location /api/ {
        proxy_pass http://backend:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
