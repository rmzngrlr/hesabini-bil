<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020817" />
    <meta name="description" content="Kişisel Bütçe ve Altın Takip Uygulaması" />
    <title>Hesabını Bil!</title>
    <script>
      // Tema sinifini (dark) React YUKLENMEDEN ONCE uygula: Login ve kilit ekrani
      // da (BudgetProvider disinda kaldiklarindan) dogru temada gorunsun, flash
      // olmasin. Kaynak BudgetContext ile ayni: localStorage 'theme' -> yoksa sistem.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList[t === 'dark' ? 'add' : 'remove']('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#020817' : '#ffffff');
        } catch (e) { /* yoksay */ }
      })();
    </script>
      <style>
      /* Prevent double-tap to zoom natively without breaking scroll */
      * {
        touch-action: manipulation;
      }
    </style>
    <script>
      // Prevent pinch-to-zoom on iOS specifically via JS, carefully checking for multiple touches
      // without breaking standard 1-finger vertical/horizontal scrolling.
      document.addEventListener('touchmove', function(event) {
        if (event.touches.length > 1) {
          event.preventDefault(); // Stop pinch to zoom
        }
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
