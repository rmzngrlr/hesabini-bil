services:
  # Reverse proxy + self-signed HTTPS (Caddy dahili CA). Tek halka acik servis.
  caddy:
    image: caddy:2-alpine
    container_name: hesabini_bil_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - frontend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hesabini_bil_frontend
    # Artik host'a/internet'e ACILMIYOR; yalniz Caddy ic agdan erisir.
    expose:
      - "3002"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hesabini_bil_backend
    # Artik host'a/internet'e ACILMIYOR; frontend nginx /api'yi ic agdan proxy'ler.
    expose:
      - "3005"
    env_file:
      - ./server/.env
    environment:
      - DB_HOST=host.docker.internal
      - DB_NAME=hesabini_bil
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
