services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hesabini_bil_frontend
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hesabini_bil_backend
    ports:
      - "3005:3005"
    env_file:
      - ./server/.env
    environment:
      DB_HOST: "172.17.0.1"
    restart: unless-stopped
