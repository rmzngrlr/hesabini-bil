services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hesabini_bil_frontend
    # Host portu YOK: uygulamaya yalniz Cloudflare Tunnel (cloudflared) uzerinden
    # erisilir. cloudflared ayni compose aginda "frontend:3002"e ulasir; LAN/IP ile
    # dogrudan erisim kapali (yalniz domain + gecerli HTTPS).
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hesabini_bil_backend
    # Host portu YOK: backend'e yalniz frontend (nginx) compose agindan "backend:3005"
    # ile ulasir; disaridan dogrudan erisim kapali.
    env_file:
      - ./server/.env
    environment:
      - DB_HOST=host.docker.internal
      - DB_NAME=hesabini_bil
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hesabini_bil_tunnel
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - frontend
