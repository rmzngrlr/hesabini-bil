<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 20 20" width="512" height="512">
  <!-- Panel basligindaki (Layout.tsx) lucide "layout-dashboard" ikonunun favicon surumu.
       Renk, index.css'teki primary CSS degiskeniyle ayni deger: acik temada koyu
       lacivert, koyu temada beyaza yakin. Boylece sekme cubugu hangi temadaysa ona uyar.
       viewBox 2..22: lucide'in 3..21 arasindaki cizimine 1 birim bosluk birakir;
       kucuk boyutta (16px) daha okunakli olsun diye fazla dolgu kirpildi.
       NOT: XML yorumlarinda cift tire kullanilamaz, o yuzden degisken adi tiresiz yazildi. -->
  <style>
    .mark { stroke: hsl(222.2 47.4% 11.2%); }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: hsl(210 40% 98%); }
    }
  </style>
  <g class="mark"
     fill="none"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <rect width="7" height="9" x="3" y="3" rx="1" />
    <rect width="7" height="5" x="14" y="3" rx="1" />
    <rect width="7" height="9" x="14" y="12" rx="1" />
    <rect width="7" height="5" x="3" y="16" rx="1" />
  </g>
</svg>
